name: Backend checks
on:
  push:
    paths: ['backend/**', '.github/workflows/backend.yml']
  pull_request:
    paths: ['backend/**', '.github/workflows/backend.yml']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ci-test-only
          MYSQL_DATABASE: dream_space_test
        ports: ['3306:3306']
        options: >-
          --health-cmd="mysqladmin ping -pci-test-only"
          --health-interval=10s --health-timeout=5s --health-retries=10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Integration tests
        env:
          NODE_ENV: test
          TEST_RESET: '1'
          DB_HOST: 127.0.0.1
          DB_PORT: '3306'
          DB_NAME: dream_space_test
          DB_USER: root
          DB_PASSWORD: ci-test-only
          JWT_SECRET: ci-only-secret-at-least-32-characters-long
        run: node --import tsx --test --test-concurrency=1 test/integration.test.ts
